name: CI Copier
on:
  pull_request:
  merge_group:

# Automatically stop old builds on the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pixi
        uses: prefix-dev/setup-pixi@a09b6247153796b190642a2b53fac4241043cf6f # v0.10.0
      - name: Run linting
        run: pixi run lint
        env:
          CLICOLOR_FORCE: 1

  pytest:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pixi
        uses: prefix-dev/setup-pixi@a09b6247153796b190642a2b53fac4241043cf6f # v0.10.0
      - name: Test
        run: pixi run test --color=yes
        env:
          # needed for test_template_update
          GH_TOKEN: ${{ github.token }}

  test-generated-package-ci:
    name: Test CI of generated package (minimal-python = ${{ matrix.minimal-python-version }})
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Read and cancel the generated package's runs. Pushing goes through
      # `CI_PAT`, not this token.
      actions: write
    strategy:
      matrix:
        minimal-python-version: [py312, py314]
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pixi
        uses: prefix-dev/setup-pixi@a09b6247153796b190642a2b53fac4241043cf6f # v0.10.0
        with:
          activate-environment: true
      - name: Generate branch name
        id: branch
        run: |
          echo "name=ci/$GITHUB_SHA-${{ matrix.minimal-python-version }}" >> $GITHUB_OUTPUT
      - name: Test generated package CI
        env:
          # Reading and cancelling the generated package's runs.
          GH_TOKEN: ${{ github.token }}
          # A fine-grained token limited to this repository. `GITHUB_TOKEN`
          # can neither push files under `.github/workflows/` nor start a
          # workflow by pushing; a push made with `CI_PAT` does both.
          CI_PAT: ${{ secrets.CI_PAT }}
          BRANCH: ${{ steps.branch.outputs.name }}
          MINIMAL_PYTHON_VERSION: ${{ matrix.minimal-python-version }}
        run: |
          : "${CI_PAT:?the CI_PAT secret is not set}"
          AUTH="authorization: Bearer $GH_TOKEN"
          # Set up local Git so that copier can run "git commit".
          git config --global user.email "landocalrissian@example.com"
          git config --global user.name "Lando Calrissian"
          copier copy \
            --data project_slug="package" \
            --data project_short_description="Example Package" \
            --data github_user="LandoCalrissian" \
            --data author_name="Lando Calrissian" \
            --data author_email="lando@calrissian.org" \
            --data minimal_python_version="$MINIMAL_PYTHON_VERSION" \
            --defaults \
            --trust \
            --vcs-ref HEAD \
            . out
          cd out
          # The generated CI and build run on pull requests and on `main`;
          # here they have to run on a push to the `ci/*` branch.
          yq eval '.on = ["push"]' -i .github/workflows/ci.yml
          yq eval '.on = ["push"]' -i .github/workflows/build.yml
          git add .
          git commit -m "Initial commit"
          cid=$(git rev-parse HEAD)
          git push -f "https://x-access-token:$CI_PAT@${GITHUB_SERVER_URL#https://}/$GITHUB_REPOSITORY.git" "$cid:refs/heads/$BRANCH"
          # Wait for the generated package's CI to complete (success or failure).
          WORKFLOW_URL="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs?branch=$BRANCH&head_sha=$cid&event=push"
          echo "Waiting for inner CI to start"
          while (( $(curl -Ls --header "$AUTH" "$WORKFLOW_URL" | jq -r ".workflow_runs | length") < 1 )); do
            sleep 10
          done
          echo "Waiting for inner CI to complete"
          while curl -Ls --header "$AUTH" "$WORKFLOW_URL" | jq -r ".workflow_runs | .[] | .status" | grep --invert-match completed > /dev/null; do
            sleep 10
          done
          # Fail unless CI was successful.
          if curl -Ls --header "$AUTH" "$WORKFLOW_URL" | jq -r ".workflow_runs | .[] | .conclusion" | grep --invert-match success > /dev/null; then
            echo "CI pipeline failed"
            exit 1
          fi
      - name: Clean up CI branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CI_PAT: ${{ secrets.CI_PAT }}
          BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          AUTH="authorization: Bearer $GH_TOKEN"
          # Cancel anything still running before the branch disappears.
          for run_id in $(curl -Ls --header "$AUTH" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs?branch=$BRANCH" | jq -r ".workflow_runs | .[] | select(.status != \"completed\") | .id")
          do
            curl -Ls --header "$AUTH" --request POST "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$run_id/cancel" > /dev/null
          done
          # Delete the branch. Tolerate it never having been created.
          git push -d "https://x-access-token:$CI_PAT@${GITHUB_SERVER_URL#https://}/$GITHUB_REPOSITORY.git" "refs/heads/$BRANCH" || true

  finalize:
    name: Test CI of generated package (all)
    timeout-minutes: 5
    runs-on: ubuntu-latest
    needs: test-generated-package-ci
    if: always() && !cancelled()
    steps:
      - if: needs.test-generated-package-ci.result == 'success'
        name: All tests passed
        run: echo All tests passed

      - if: needs.test-generated-package-ci.result != 'success'
        name: Some tests failed
        run: |
          echo Some tests failed
          exit 1
